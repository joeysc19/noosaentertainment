<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noosa Entertainment Template with 3D Carousel</title>
    <link rel="stylesheet" href="https://googleapis.com">

    <!-- Import Montserrat Font from Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    
    <style>
    <style>
        /* Modern CSS Variables & Resets */
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #6366f1;
            --accent-light: #e0e7ff;
            --border-color: #e2e8f0;
            --radius: 12px;
            --transition: all 0.25s ease;
        }

        body {
            font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Clean global typography hierarchy without !important tags */
        h1, h2, h3, h4, h5, h6, p, a, span, button, li {
            font-family: 'Montserrat', sans-serif;
        }

        /* HEADER STYLES */
        .site-header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .main-nav ul {
            display: flex;
            gap: 24px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .nav-link:hover {
            color: var(--accent);
        }

        /* MAIN HERO LAYOUT AREA */
        .page-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px; /* Reduced vertical padding to allow true centering */
            
            /* FORCES DEAD VERTICAL CENTERING */
            min-height: calc(100vh - 150px); 
            box-sizing: border-box;
        }


        .hero-centered-block {
            width: 100%;
            max-width: 700px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        .hero-centered-block h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.02em;
            color: var(--text-main);
        }

        .hero-centered-block p {
            font-size: 1.15rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0;
            max-width: 600px;
        }

        /* ENLARGED BRAND LOGO DISPLAY */
        .brand-logo-display {
            width: 100%;
            max-width: 400px;
            margin-bottom: 8px;
        }

        .brand-logo-display img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        /* INTEGRATED 3D CAROUSEL STYLES */
        @keyframes autoRun3d {
            from { transform: perspective(800px) rotateY(-360deg); }
            to { transform: perspective(800px) rotateY(0deg); }
        }

        @keyframes animateBrightness {
            10% { filter: brightness(1); }
            50% { filter: brightness(0.2); }
            90% { filter: brightness(1); }
        }

        .card-3d {
            position: relative;
            width: 400px;
            height: 200px;
            transform-style: preserve-3d;
            transform: perspective(800px);
            animation: autoRun3d 20s linear infinite;
            will-change: transform;
            margin: 20px 0;
        }

        .card-3d div {
            position: absolute;
            width: 80px;
            height: 112px;
            background-color: rgb(199, 199, 199);
            border: solid 2px lightgray;
            border-radius: 0.5rem;
            top: 50%;
            left: 50%;
            transform-origin: center center;
            animation: animateBrightness 20s linear infinite;
            transition-duration: 200ms;
            will-change: transform, filter;
            overflow: hidden;
        }

        .card-3d div img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-3d:hover, .card-3d:hover div {
            animation-play-state: paused;
        }

        /* 3D Panel Angles */
        .card-3d div:nth-child(1)  { transform: translate(-50%, -50%) rotateY(0deg) translateZ(150px); animation-delay: -0s; }
        .card-3d div:nth-child(2)  { transform: translate(-50%, -50%) rotateY(36deg) translateZ(150px); animation-delay: -2s; }
        .card-3d div:nth-child(3)  { transform: translate(-50%, -50%) rotateY(72deg) translateZ(150px); animation-delay: -4s; }
        .card-3d div:nth-child(4)  { transform: translate(-50%, -50%) rotateY(108deg) translateZ(150px); animation-delay: -6s; }
        .card-3d div:nth-child(5)  { transform: translate(-50%, -50%) rotateY(144deg) translateZ(150px); animation-delay: -8s; }
        .card-3d div:nth-child(6)  { transform: translate(-50%, -50%) rotateY(180deg) translateZ(150px); animation-delay: -10s; }
        .card-3d div:nth-child(7)  { transform: translate(-50%, -50%) rotateY(216deg) translateZ(150px); animation-delay: -12s; }
        .card-3d div:nth-child(8)  { transform: translate(-50%, -50%) rotateY(252deg) translateZ(150px); animation-delay: -14s; }
        .card-3d div:nth-child(9)  { transform: translate(-50%, -50%) rotateY(288deg) translateZ(150px); animation-delay: -16s; }
        .card-3d div:nth-child(10) { transform: translate(-50%, -50%) rotateY(324deg) translateZ(150px); animation-delay: -18s; }

        /* STICKY FOOTER STYLES */
        .site-footer {
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 24px 20px;
            text-align: center;
            margin-top: auto;
        }

        .footer-container p {
            margin: 4px 0;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .footer-container .footer-note {
            color: var(--accent); 
            font-size: 0.75rem;
            font-weight: 500;
        }

        /* MOBILE TARGETED STYLES */
        @media (max-width: 768px) {
            .hero-centered-block h1 {
                font-size: 1.65rem; /* Safely resizes on iPhone 11 viewports */
            }
            .hero-centered-block p {
                font-size: 0.95rem; /* Shrinks the hero paragraph text */
            }
            .brand-logo {
                font-size: 1rem; /* Shrinks the "Noosa Entertainment" logo text */
            }
        }


        .icon-text-line {
    display: flex;
    align-items: center;
    justify-content: center; /* Keeps things centered like your current hero layout */
    gap: 8px; /* Adds space between the icon and text */
    margin-bottom: 6px; /* Adds space between the two lines */
    color: var(--text-main);
}

.icon-text-line .material-symbols-outlined {
    color: var(--accent); /* Makes icons match your purple/indigo accent color */
    font-size: 1.3rem; /* Adjusts icon scale to match text size nicely */
}

        .custom-icon-line {
    display: flex;
    align-items: center;
    justify-content: center; /* Keeps text centered in your hero block */
    gap: 10px;               /* Space between your image icon and text */
    margin-bottom: 8px;      /* Space between the two lines */
}

.custom-icon {
    width: 24px;             /* Forces the image down to icon width */
    height: 24px;            /* Forces the image down to icon height */
    object-fit: contain;     /* Prevents your image from squishing or stretching */
    display: block;
}

.tight-text-group {
    display: flex;
    flex-direction: column;
    align-items: flex-start; /* Keeps the text lines aligned on their left edge */
    gap: 4px;  
    padding: 0;
    margin: 0;
    
    /* NEW WORKING CENTERING METHOD */
    width: max-content;      /* Shrinks the box to perfectly hug the text */
    align-self: center;      /* Forces the entire box into the dead center */
}



.custom-icon-line {
    display: flex;
    align-items: center;
    justify-content: flex-start; /* Shifts icons and text to the far left */
    gap: 8px;   
    margin: 0;  
    line-height: 1.3; 
}


.custom-icon {
    width: 22px;
    height: 22px;
    object-fit: contain;
    display: block;
}




    </style>


</head>

<div class="tight-text-group">
