<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minimalist Carousel</title>
    <style>
        .carousel { width: 100%; max-width: 600px; overflow: hidden; position: relative; }
        .carousel-inner { display: flex; transition: transform 0.5s ease; }
        .carousel-item { min-width: 100%; box-sizing: border-box; position: relative; }
        .carousel-item img { width: 100%; display: block; }
        .caption { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.5); color: #fff; padding: 10px; }
    </style>
</head>
<body>
    <div class="carousel">
        <div class="carousel-inner">
            <div class="carousel-item"><img src="img1.jpg"><div class="caption">Text 1</div></div>
            <div class="carousel-item"><img src="img2.jpg"><div class="caption">Text 2</div></div>
        </div>
    </div>
    <script>
        let index = 0;
        const inner = document.querySelector('.carousel-inner');
        function move() {
            index = (index + 1) % 2;
            inner.style.transform = `translateX(-${index * 100}%)`;
        }
        setInterval(move, 3000);
    </script>
</body>
</html>
